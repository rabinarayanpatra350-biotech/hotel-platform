name: CI

# Runs on every push and every pull request, as the brief requires.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- backend
  api:
    name: API — lint, test, coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hotel_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Syntax-check every source file
        working-directory: server
        run: |
          set -e
          for f in $(find src scripts -name '*.js'); do node --check "$f"; done
          echo "all source files parse"

      - name: Apply migrations against the service database
        working-directory: server
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hotel_test
        run: npm run migrate

      - name: Seed the raw exports through the ETL
        working-directory: server
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hotel_test
        run: npm run seed

      - name: Run the test suite
        working-directory: server
        env:
          # CI uses the Postgres service container above, so the embedded
          # dev database is not needed here.
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hotel_test
          NODE_ENV: test
          CI: 'true'
        run: npm test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: server/coverage
          retention-days: 7

  # ---------------------------------------------------------------- frontend
  web:
    name: Web — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build
      - name: Report bundle size
        working-directory: web
        run: du -sh dist && ls -la dist/assets

  # ---------------------------------------------------------------- secrets
  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if .env or a private key was committed
        run: |
          set -e
          if git ls-files | grep -E '(^|/)\.env$|\.env\.(production|local)$'; then
            echo "::error::A .env file is committed. Remove it and use environment variables."
            exit 1
          fi
          if git ls-files -z | xargs -0 grep -lE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' 2>/dev/null; then
            echo "::error::A private key was committed."
            exit 1
          fi
          echo "no secrets found in the tracked tree"
