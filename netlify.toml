# Netlify deployment: the React build is served as static files and the Express
# API runs as a single serverless function. Same code, different host — the app
# module is untouched, which is the point of keeping the Express app free of any
# listen() call.
[build]
  command = "npm --prefix web ci && npm --prefix web run build"
  publish = "web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  # The API needs the whole server source tree; Netlify's bundler follows the
  # imports, and these are the files it must not tree-shake away.
  included_files = ["server/src/db/schema.sql", "docs/openapi/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback: client-side routes must not 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
